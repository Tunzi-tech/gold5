<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enffas</title>
  </head>
  <body>
    <div id="app"></div>
  <script>
    // Earliest Enffas startup diagnostics: runs before Vite/Vue modules load.
    (function () {
      var state = window.__ENFFAS_EARLY_DIAGNOSTICS__ = {
        startedAt: new Date().toISOString(),
        stage: 'html-bootstrap',
        errors: [],
        mark: function (stage) { this.stage = stage; }
      };
      function record(message) {
        if (state.errors.indexOf(message) === -1) state.errors.push(message);
        if (state.errors.length > 8) state.errors.shift();
      }
      function escapeHtml(value) {
        return String(value).replace(/[&<>"]/g, function (c) {
          return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);
        });
      }
      // Cooperative freeze detector: measures event-loop lag and keeps only a
      // small rolling sample. It does not inspect or change application data.
      var lagSamples = [];
      var lastHeartbeat = Date.now();
      var detectorStopped = false;
      function heartbeat() {
        if (detectorStopped) return;
        var now = Date.now();
        var lag = Math.max(0, now - lastHeartbeat - 1000);
        lastHeartbeat = now;
        if (lag > 1500) {
          lagSamples.push({ at: new Date(now).toISOString(), lagMs: lag, stage: state.stage });
          if (lagSamples.length > 5) lagSamples.shift();
        }
        window.setTimeout(heartbeat, 1000);
      }
      window.setTimeout(heartbeat, 1000);
      window.addEventListener('pagehide', function () { detectorStopped = true; });
      function addFreezeDetails(panel) {
        var details = document.createElement('div');
        details.style.cssText = 'margin-top:16px;padding-top:12px;border-top:1px solid #657ba9';
        var title = document.createElement('h3');
        title.textContent = 'Event-loop responsiveness';
        details.appendChild(title);
        var status = document.createElement('p');
        status.textContent = lagSamples.length
          ? 'Long pauses detected (over 1.5 seconds): ' + lagSamples.length
          : 'No long pause was recorded by this detector before the report ran.';
        details.appendChild(status);
        if (lagSamples.length) {
          var list = document.createElement('ul');
          lagSamples.forEach(function (sample) {
            var item = document.createElement('li');
            item.textContent = sample.lagMs + ' ms pause · stage: ' + sample.stage + ' · ' + sample.at;
            list.appendChild(item);
          });
          details.appendChild(list);
        }
        var note = document.createElement('p');
        note.textContent = 'Note: a fully blocked main thread cannot run its own detector while blocked. These measurements show pauses only when JavaScript resumes.';
        details.appendChild(note);
        panel.appendChild(details);
      }
      window.addEventListener('error', function (event) {
        var target = event.target;
        var detail = event.message || (target && (target.src || target.href)) || 'Unknown browser error';
        record(('Browser error: ' + detail).slice(0, 300));
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        record(('Unhandled rejection: ' + (reason && reason.message ? reason.message : String(reason || 'unknown'))).slice(0, 300));
      });
      window.setTimeout(function () {
        var app = document.getElementById('app');
        var appText = app ? (app.innerText || app.textContent || '') : '';
        var appHasRenderedContent = !!app && app.children.length > 0 && appText.trim().length > 20;
        var stillLoading = /\bloading\b|loading[.…]{1,3}/i.test(appText);
        var visibleLoadingOverlay = Array.prototype.some.call(
          document.querySelectorAll('[class*="loading" i], [class*="opening" i], [aria-label*="loading" i], [role="progressbar"]'),
          function (element) {
            var style = window.getComputedStyle(element);
            var rect = element.getBoundingClientRect();
            return style.display !== 'none' && style.visibility !== 'hidden' &&
              Number(style.opacity || 1) > 0 && rect.width > 0 && rect.height > 0 &&
              (rect.width >= window.innerWidth * 0.5 || rect.height >= window.innerHeight * 0.5);
          }
        );
        // Vue mounting is not enough: the app can still be stuck on its loading screen.
        if (state.stage === 'mount-complete' && appHasRenderedContent && !stillLoading && !visibleLoadingOverlay) return;
        var panel = document.getElementById('enffas-early-diagnostics');
        if (!panel) {
          panel = document.createElement('section');
          panel.id = 'enffas-early-diagnostics';
          panel.setAttribute('role', 'alert');
          panel.style.cssText = 'position:fixed;z-index:2147483647;inset:12px;padding:22px;overflow:auto;background:#09111f;color:#e8efff;border:1px solid #657ba9;border-radius:14px;font:14px/1.6 system-ui,sans-serif;box-shadow:0 12px 50px #0009';
          document.body.appendChild(panel);
        }
        var errors = state.errors.length ? state.errors : ['No browser error was captured before startup stalled.'];
        panel.innerHTML = '<h2 style="margin:0 0 8px">Enffas early startup check</h2><p>This check found that startup either did not finish mounting Vue or the app still appears to be stuck loading. This diagnostic does not clear or modify saved data.</p><p><b>Last confirmed stage:</b> ' + escapeHtml(state.stage) + '</p><p><b>Loading screen still detected:</b> ' + (stillLoading || visibleLoadingOverlay ? 'yes' : 'no') + '</p><p><b>Started:</b> ' + escapeHtml(state.startedAt) + '</p><ul>' + errors.map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul><p>Please copy these details before refreshing.</p>';
        addFreezeDetails(panel);
      }, 12000);
    })();
  </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
